# gitleaks configuration: the default rules, plus an allowlist of exact literals that
# only look like secrets — test-fixture token values and specific code lines the
# generic-api-key rule misreads. Every entry must be an exact literal, never a
# pattern broad enough to hide a real credential. A fake key line that only old commits of a
# pull request still carry is allowed in those commits alone (commits AND regexes), so the
# literal can never hide a real key written next to it elsewhere.
[extend]
useDefault = true

[[allowlists]]
description = "Fake fixture tokens in SDK/CLI tests, and code lines misread as keys"
regexTarget = "line"
regexes = [
  # A truncated, unusable key fragment in a connection-validation test that checks a pasted key is refused.
  '''MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg''',
  '''lakana_pat_abc123_x_y-z_secret''',
  '''lakana_pat_k9_newsecret''',
  '''url=base_url, token=token, default_environment=environment''',
  '''"local", url=url, token=token, default_environment="dev"''',
  '''"local", url=url, token=token, default_environment=None''',
  '''dGhpc2lzYXNlY3JldGtleQ==''',   # base64("thisisasecretkey"), a test-fixture master key
  '''lakana_pat_m5aintegration_m5aintegrationsecret''',   # integration-test fixture token
  '''lakana_pat_m5bintegration_m5bintegrationsecret''',   # integration-test fixture token
  '''m5bintegrationsecret''',   # its secret half, hashed in the same fixture
  '''lakana_pat_m5c1integration_m5c1integrationsecret''',   # integration-test fixture token
  '''m5c1integrationsecret''',   # its secret half
  '''lakana_pat_m5c2aintegration_m5c2aintegrationsecret''',   # integration-test fixture token
  '''m5c2aintegrationsecret''',   # its secret half
  # A grant in a test: the words TOKEN and kind= on one line are read as a key and its value.
  '''principal_id=bob.id, action=Action.MANAGE_TOKEN, kind=SecurableKind.INSTANCE''',
  # Two made-up example values that earlier commits of #247 had in
  # docs/site/reference/ci-trust-rules.md (now placeholders); the pull request's commit scan still
  # reads those commits.
  '''eyJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9.eyJpc3MiOiIuLi4ifQ.c2lnbmF0dXJl''',
  '''lakana_ci_3f2a9c1b7d4e8f60_8m1Zr0qWn5x7sK2bVt9yLcD4gH6jA0pE3uF5iO7wQ1s''',
]

[[allowlists]]
# A made-up key block that commit 9d15db8 of #279 had in test_ca_bundle.py (now built from
# parts); the pull request's commit scan still reads that commit.
description = "A fake key line of #279, in the commit that had it"
condition = "AND"
commits = ["9d15db89705f464caa1bf412f34bd69ea4ba2a20"]
regexTarget = "line"
regexes = [
  '''path\.write_bytes\(_PEM \+ b"-----BEGIN PRIVATE KEY-----\\nMIIE\\n-----END PRIVATE KEY-----\\n"\)''',
]

[[allowlists]]
# A made-up key header that commits c8b101f and d38b32a of #292 had in test_trust.py (now
# built from parts); the pull request's commit scan still reads those commits.
description = "Fake key lines of #292, in the commits that had them"
condition = "AND"
commits = [
  "c8b101f5d4afc51852457fd6ac9fd3ebacc683c7",
  "d38b32a9366e78820b5d94cc0de9bc2e70589b7e",
]
regexTarget = "line"
regexes = [
  '''_KEY = b"-----BEGIN PRIVATE KEY-----\\nAA==\\n"''',
  '''\(_CERTIFICATE \+ b"-----BEGIN PRIVATE KEY-----\\nAA==\\n", "also holds a private key"\),''',
]

[[allowlists]]
# A made-up wrong password that commits 80b0634 and 483adbf of PR 7a (#27) had in
# test_ingest_sql_integration.py (now made at run time); the pull request's commit scan still
# reads those commits.
description = "A fake wrong password of PR 7a, in the commits that had it"
condition = "AND"
commits = [
  "80b0634155d3546d71fb2c395f8f89b413d722e1",
  "483adbf6c0b39264bd0ad150864db7f21de5ac06",
]
regexTarget = "line"
regexes = [
  '''    _crm\(pki, password="wrong-0123456789"\)''',
  '''    _shop\(pki, password="wrong-0123456789"\)''',
]
