# The Lakana documentation site. Pages are plain Markdown under docs/site.
# Build: uv run --group docs zensical build --strict
# Serve: uv run --group docs zensical serve
# Generator: Zensical (reads this file). Strict mode fails on a broken link or anchor; it does
# not check navigation (see the comment at `nav`).
site_name: Lakana
site_description: A data lakehouse for small and medium teams.
site_url: https://lakana-labs.github.io/lakana/
docs_dir: docs/site
site_dir: site-build
theme:
  # No web font: the site makes no request to a third party, so it works on an internal network.
  font: false
  features:
    - content.code.copy
    - navigation.sections
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
# Navigation completeness (every page listed, every entry a page) is enforced by
# scripts/tests/test_docs_site.py, because the generator does not check it.
nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - tutorials/getting-started.md
      - tutorials/python-sample.md
      - tutorials/train-a-model.md
      - tutorials/move-a-sql-project.md
  - How-to guides:
