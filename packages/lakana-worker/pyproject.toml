[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lakana-worker"
description = "Lakana's DuckDB query executor and dequeue loop."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Christopher Schymura" }]
keywords = ["lakehouse", "duckdb", "iceberg", "data-platform"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
urls = { Homepage = "https://github.com/lakana-labs/lakana", Documentation = "https://lakana-labs.github.io/lakana/", Repository = "https://github.com/lakana-labs/lakana", Issues = "https://github.com/lakana-labs/lakana/issues", Changelog = "https://github.com/lakana-labs/lakana/blob/main/CHANGELOG.md" }
dynamic = ["version", "dependencies"]

[project.scripts]
lakana-worker = "lakana_worker.command:cli"
lakana-launcher = "lakana_worker.launcher.__main__:main"
lakana-egress = "lakana_worker.launcher.egress:main"

[tool.uv.sources]
lakana-core = { workspace = true }

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.metadata.hooks.custom]
# Loads `hatch_build.py`'s `CoreDependencyMetadataHook`, which appends
# `lakana-core==<this build's version>` to the `dependencies` list below,
# pinning lakana-worker to exactly this release's lakana-core -- the
# same hatch-vcs-resolved version pattern as `packages/lakana/hatch_build.py`'s
# `ServerExtraMetadataHook`. `dependencies` lives here, not under
# `[project]`, because hatchling requires the hook to supply the *entire*
# list once `dependencies` is dynamic; keeping the other pins and their
# comments in this table (rather than hard-coding them into hatch_build.py)
# keeps them visible and editable as ordinary TOML.
dependencies = [
    # MIT. 2.0 is the long-term-support line (supported until at least October 2027); the
    # query process uses its settings (`extension_directories`, `allow_extension_repositories`,
    # `async_threads`), so 1.x no longer works. Capped below 3: a major release changes SQL
    # and settings, and the guard's function lists are swept against each one (issue #96).
    "duckdb>=2.0,<3",
    # BSD-3-Clause. Sends webhooks (`egress.py`); the lakana SDK already depends on it.
    "httpx>=0.28,<1",
    # MPL-2.0, used unmodified (allowlisted in scripts/check_licenses.py). The last place the
    # query process looks for a CA bundle (`ca_bundle.py`), and the public roots of the trust
    # bundle of builds and tasks (`trust.py`); shipped through httpx already.
    "certifi>=2024.2.2",
    # Apache-2.0 OR BSD-3-Clause. Parses each certificate of LAKANA_RUN__CA_BUNDLE as X.509
    # and writes it again in canonical form (`trust.py`); lakana-core already depends on it.
    "cryptography>=50.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lakana_worker"]
