[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lakana-core"
description = "Lakana domain and persistence layer."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Christopher Schymura" }]
keywords = ["lakehouse", "duckdb", "iceberg", "data-platform"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
urls = { Homepage = "https://github.com/lakana-labs/lakana", Documentation = "https://lakana-labs.github.io/lakana/", Repository = "https://github.com/lakana-labs/lakana", Issues = "https://github.com/lakana-labs/lakana/issues", Changelog = "https://github.com/lakana-labs/lakana/blob/main/CHANGELOG.md" }
dynamic = ["version"]
dependencies = [
    "sqlalchemy>=2.1.6",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.16.0",
    "pyiceberg>=0.12,<0.13",
    "fsspec>=2026.9.0",
    # pyiceberg's PyArrowFileIO needs pyarrow, but pyarrow only arrives
    # transitively through pyiceberg's optional "pyarrow" extra, which this
    # package does not request. Without it, build_file_io logs an error on
    # every call and silently falls back to FsspecFileIO, so a deployment
    # (which also lacks pyarrow unless something else pulls it in) runs a
    # different FileIO implementation than the tests exercise. Apache-2.0,
    # same as the rest of this dependency set.
    "pyarrow>=26.0.0",
    # `StorageConfig.scheme` promises "s3", and `StorageResolver.for_environment`
    # builds `FsspecStorage` eagerly through `fsspec.core.url_to_fs`, which
    # raises ImportError for the s3 scheme without this installed — before any
    # table operation gets a chance to use pyiceberg's own (pyarrow-backed)
    # S3 support. BSD-3-Clause.
    "s3fs>=2026.9.0",
    # MIT. SQL parsing, identifier resolution, lineage extraction, and the
    # rewrite that replaces a qualified table reference with a scoped read —
    # one dependency for all four.
    "sqlglot>=30.21.0,<31",
    # Apache-2.0 OR BSD-3-Clause. Envelope encryption for secrets: AES-256-GCM
    # via AESGCM, verified directly against this exact version during
    # plan-writing (see this plan's Global Constraints).
    "cryptography>=50.0.2",
    # Postgres driver for team mode (`postgresql+pg8000://`). BSD-3, pure
    # Python. psycopg is LGPL-3.0 and forbidden (CLAUDE.md rule 4).
    "pg8000>=1.31.6",
    # MIT. Loads `lakana.yaml` and SQL front-matter from deployed repositories
    # through an alias-refusing SafeLoader subclass
    # (`lakana_core.projects.yaml_loader`).
    "pyyaml>=6.0.3",
    # Apache-2.0. The one source of time zone rules (`lakana_core.jobs.tz`), so that the deploy
    # check and the scheduler agree on every machine and a slim container needs no system
    # database.
    "tzdata>=2026.5",
    # BSD-3-Clause. The outbound HTTPS client of `lakana_core.net` (the discovery documents and
    # key sets of CI OIDC issuers) and the shared egress checks the worker's webhooks use.
    "httpx>=0.28,<1",
    # MIT. Verifies the signature of a CI provider's OIDC ID token (`lakana_core.ci_oidc`); every
    # claim is checked by Lakana itself. Its `crypto` extra only adds `cryptography`, listed above.
    "pyjwt>=2.15.1",
]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/lakana_core"]

[tool.mutmut]
source_paths = ["src/lakana_core"]
only_mutate = [
    "src/lakana_core/grants/authorization.py",
    "src/lakana_core/policy/*",
    "src/lakana_core/audit/authorization.py",
    "src/lakana_core/catalog/external_location.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-m", "not integration", "-p", "no:cacheprovider"]
also_copy = ["tests/", "alembic.ini"]
