# Lakana team deployment — generated by `lakana bundle init`. Guide:
# https://lakana-labs.github.io/lakana/how-to/deploy-with-compose/
# Every value comes from .env (mode 0600). Requires Docker Compose >= 2.24.
name: lakana

x-lakana-env: &lakana-env
  LAKANA_DATABASE__URL: postgresql+pg8000://lakana:${POSTGRES_PASSWORD}@postgres:5432/lakana
  LAKANA_SECRETS__MASTER_KEY: ${LAKANA_SECRETS__MASTER_KEY}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lakana
      POSTGRES_DB: lakana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # -h 127.0.0.1: the postgres image's temporary initdb server (which
      # runs before the real one) answers only on its Unix socket, not TCP,
      # so a socket-only pg_isready can report ready before TCP is actually
      # listening, letting `migrate` start and fail against a server that
      # isn't there yet on a slow first boot.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lakana -d lakana"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # SeaweedFS runs as two containers so that user SQL in the worker, which has DuckDB's HTTP
  # filesystem enabled, can reach nothing of it but the S3 gateway (#14; what is and is not
  # protected: https://lakana-labs.github.io/lakana/explanation/compose-known-gaps/).
  # `seaweedfs-core` runs the master (9333), volume server (8080) and filer, whose HTTP APIs need
  # no credentials, and joins only `seaweed-internal`, which no worker or server joins.
  # `seaweedfs` is the S3 gateway alone: the one container on both networks. It listens on 8333
  # and on its gRPC port 18333, which cannot be turned off and has no authentication (a residual,
  # see https://lakana-labs.github.io/lakana/explanation/compose-known-gaps/#the-grpc-port-of-the-seaweedfs-gateway);
  # its Iceberg and Lance ports are off. Its name is the endpoint everything else already uses.
  seaweedfs-core:
    image: chrislusf/seaweedfs:4.47
    # -disableHttp also closes the filer's plain-HTTP file route, so the gateway, which reaches
    # the filer over gRPC, is the only way to the data even from inside `seaweed-internal`.
    command: server -filer -dir=/data -ip.bind=0.0.0.0 -disableHttp
    networks: [seaweed-internal]
    volumes: [seaweed:/data]
    healthcheck:
      # The master answers, and the filer's gRPC port (18888) accepts connections: the gateway
      # and `bucket` both need the filer, which takes longer to replay on a restart with data.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9333/cluster/status >/dev/null && nc -z 127.0.0.1 18888"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    # -ip: the address the gateway advertises; it sits on two networks, so say the one the core reaches.
    command: s3 -port=8333 -port.iceberg=0 -port.lance=0 -ip=seaweedfs -filer=seaweedfs-core:8888 -config=/etc/seaweedfs/s3.json
    configs:
      - source: s3-identity
        target: /etc/seaweedfs/s3.json
    networks: [default, seaweed-internal]
    depends_on:
      seaweedfs-core: {condition: service_healthy}
    healthcheck:
      # A bare S3 GET is unauthenticated and always answers 403 once the listener is up, so
      # grep for any non-"000" (connection-refused) HTTP code rather than requiring 2xx.
      # `bucket` and `worker` need the filer behind the gateway, so gate on this, not the core.
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ | grep -qE '^[1-9][0-9]{2}$'",
        ]
      interval: 5s
      retries: 30
    restart: unless-stopped

  bucket:
    image: chrislusf/seaweedfs:4.47
    networks: [seaweed-internal]
    depends_on:
      seaweedfs: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        echo 's3.bucket.list' | weed shell -master=seaweedfs-core:9333 | grep -qw lakana
        || echo 's3.bucket.create -name lakana' | weed shell -master=seaweedfs-core:9333
    restart: "no"

  migrate:
    image: ${LAKANA_IMAGE}
    command: ["lakana-server", "migrate"]
    environment: *lakana-env
    healthcheck: {disable: true}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  server:
    image: ${LAKANA_IMAGE}
    command: ["lakana-server"]
    environment:
      <<: *lakana-env
      LAKANA_BOOTSTRAP_PAT_KEY_ID: ${LAKANA_BOOTSTRAP_PAT_KEY_ID}
      LAKANA_BOOTSTRAP_PAT_SECRET: ${LAKANA_BOOTSTRAP_PAT_SECRET}
      LAKANA_REPO_ROOTS: '["/repos"]'
    volumes: ["./repos:/repos:ro"]
    ports: ["${LAKANA_BIND}:${LAKANA_PORT}:8000"]
    # Healthy once the process answers /healthz, as in the image. Not /readyz: that one also
    # needs a live worker, and the workers start only after `setup`, which waits for this.
    # Ask /readyz from outside to know whether the instance can do work.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f\"http://127.0.0.1:{os.environ.get('LAKANA_PORT', '8000')}/healthz\", timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  # The only service that holds the Docker socket, which is root on the host. It starts each
  # Python task and each environment build in a container of its own, from one narrow request
  # the worker sends over a Unix socket in the launcher-socket volume. No network, no
  # capabilities, a read-only filesystem; root only to open the socket, whose group varies by host.
  # It runs on the image's base interpreter (-I -S, standard library only) from its own copy of
  # its code, so no `.pth` file of a dependency runs next to the socket; so does its healthcheck.
  launcher:
    image: ${LAKANA_IMAGE}
    command: ["/usr/local/bin/python", "-I", "-S", "-c", "import sys; sys.path.insert(0, '/opt/lakana-launcher'); from lakana_worker.launcher.__main__ import main; main()"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    user: "0:0"
    environment:
      LAKANA_LAUNCHER__STACK: ${COMPOSE_PROJECT_NAME}
      LAKANA_LAUNCHER__IMAGES: '{"3.11": "${LAKANA_TASK_IMAGE:?set LAKANA_TASK_IMAGE in .env, see the upgrade notes}-py3.11", "3.12": "${LAKANA_TASK_IMAGE}-py3.12", "3.13": "${LAKANA_TASK_IMAGE}-py3.13", "3.14": "${LAKANA_TASK_IMAGE}-py3.14"}'
      # Ranges egress and relays refuse besides Docker's gateways: this host's LAN address (.env).
      LAKANA_LAUNCHER__EGRESS_REFUSED: ${LAKANA_EGRESS_REFUSED:-}
      # Host directories a task's `directory` and `sqlite-file` connections read, mounted
      # read-only (.env). Blank, as in a .env that predates the key, means none.
      LAKANA_LAUNCHER__INGESTION_ROOTS: ${LAKANA_INGESTION_ROOTS:-}
    volumes:
      - ${LAKANA_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - launcher-socket:/run/lakana-launcher
      - launcher-state:/var/lib/lakana-launcher
      - egress-key:/run/lakana-egress
      # Mounted here only so that this first mount gives the fresh volume the owner and mode of
      # the image's directory (uid 10001, 0700), which the workers need; root without
      # capabilities cannot enter it. The launcher mounts it into task containers by name.
      - task-work:/var/lib/lakana-task-work
    # Healthy while the launcher listens: a connection, not the file, which an earlier launcher
    # leaves in the volume. The launcher closes a connection that sends nothing without a log line.
    healthcheck:
      test: ["CMD", "/usr/local/bin/python", "-I", "-S", "-c", "import socket; s = socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect('/run/lakana-launcher/launcher.sock'); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Builds reach package indexes only through this proxy, and only the hosts the launcher signed
  # for each build. It is on the default network and joins each build's own network. It reads
  # the launcher's key (0640, group 10001) read-only, in group 10001, on the base interpreter.
  egress:
    image: ${LAKANA_IMAGE}
    command: ["/usr/local/bin/python", "-I", "-S", "-c", "import sys; sys.path.insert(0, '/opt/lakana-launcher'); from lakana_worker.launcher.egress import main; main()"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    environment:
      LAKANA_EGRESS__UPSTREAM_PROXY: ${LAKANA_EGRESS_UPSTREAM_PROXY:-}
    volumes: ["egress-key:/run/lakana-egress:ro"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/python", "-I", "-S", "-c", "import socket; socket.create_connection(('127.0.0.1', 3128), timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      launcher: {condition: service_healthy}
    restart: unless-stopped

  worker: &worker
    image: ${LAKANA_IMAGE}
    command: ["lakana-worker"]
    # SIGTERM lets a running task finish for LAKANA_RUN__DRAIN_GRACE_SECONDS (20 s), then
    # releases it to another worker: a Python task needs another 10 s (LAKANA_RUN__KILL_GRACE)
    # to stop its process and 2 s to drain its output, about 32 s in all. Compose must wait
    # longer than that before SIGKILL.
    stop_grace_period: 45s
    # Memory limit per replica, no swap: one query cannot take the host down. The worker
    # reads this limit and stops itself at 90% of it (recording why against its running query or
    # task) before the kernel would kill the container; `restart` brings either back.
    # LAKANA_WORKERS + LAKANA_WORKERS_INTERACTIVE + LAKANA_WORKERS_PIPELINE, times this, must fit
    # the host. The default lets a bundle whose .env predates the value start.
    # Python tasks run in containers of their own, outside this limit, each with
    # LAKANA_RUN__TASK_MEMORY (2 GB by default): the host needs the workers' total plus that much
    # per task running at once (one per worker).
    mem_limit: ${LAKANA_WORKER_MEMORY:-4g}
    memswap_limit: ${LAKANA_WORKER_MEMORY:-4g}
    environment: &worker-env
      <<: *lakana-env
      LAKANA_REPO_ROOTS: '["/repos"]'
      # Python assets: a task's subprocess talks to the server over REST.
      LAKANA_RUN__SERVER_URL: http://server:8000
      # docker: each Python task in a container of its own, started by `launcher`; local: as
      # this container's own processes, without isolation (launcher and egress still start).
      LAKANA_RUN__RUNNER: ${LAKANA_RUNNER:-docker}
    volumes:
      - ./repos:/repos:ro
      # Venvs, kept across restarts and shared by the replicas. The image creates the directory
      # owned by the `lakana` user with mode 0700; the worker refuses a cache that is not private.
      - worker-cache:/home/lakana/.cache/lakana-worker
      # The launcher's socket and token; the worker never holds the Docker socket itself.
      - launcher-socket:/run/lakana-launcher
      # Attempt directories: the launcher mounts a task's code and scratch from here.
      - task-work:/home/lakana/.cache/lakana-worker/attempts
    # The worker serves no HTTP. `lakana-worker healthcheck` asks the database whether the worker
    # of this container wrote its heartbeat within LAKANA_RUN__LEASE_SECONDS, which it does only
    # while it reaches the database; it gives up after 3 s. Not `disable: true`: older Compose v2
    # releases fail `up --wait` with "has no healthcheck configured" for a service without one.
    healthcheck:
      test: ["CMD", "lakana-worker", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      replicas: ${LAKANA_WORKERS}
    depends_on:
      migrate: {condition: service_completed_successfully}
      launcher: {condition: service_healthy}
      # Makes `docker compose up --wait` itself block until `setup` exits and
      # fail if it exits non-zero -- the same mechanism `server` uses for
      # `migrate` above. Without a real dependent, `--wait` reports a
      # `healthcheck: {disable: true}` one-shot healthy the moment it starts,
      # not when it exits, and a separate `docker compose wait setup` step
      # raced `setup`'s own fast exit on a restart two different ways (a
      # restarted `setup` sends two GETs and exits in under a second): `up
      # --wait` could poll it after it already exited and report `up` failed,
      # or `wait setup` could run after the container was already gone and
      # find nothing to wait on. Gating through a dependency has neither race
      # (the worker doesn't otherwise need to wait on `setup`, but
      # it's the natural dependent since it's the other REST API caller `dev`
      # existing matters to).
      setup: {condition: service_completed_successfully}
    restart: unless-stopped

  # Workers for one kind of work, from the definition of `worker`: the same image, limits and
  # restart policy. A YAML merge is shallow, so `environment` is merged again. Both start no replica
  # until .env says so; `worker` keeps taking everything (LAKANA_WORKER__TAKES=all).
  worker-interactive:
    <<: *worker
    environment:
      <<: *worker-env
      LAKANA_WORKER__TAKES: interactive
    deploy:
      replicas: ${LAKANA_WORKERS_INTERACTIVE:-0}

  worker-pipeline:
    <<: *worker
    environment:
      <<: *worker-env
      LAKANA_WORKER__TAKES: pipeline
    deploy:
      replicas: ${LAKANA_WORKERS_PIPELINE:-0}

  setup:
    image: ${LAKANA_IMAGE}
    command: ["python", "-m", "lakana.cli.deploy.setup"]
    healthcheck: {disable: true}
    environment:
      LAKANA_SETUP_URL: http://server:8000
      LAKANA_SETUP_TOKEN: lakana_pat_${LAKANA_BOOTSTRAP_PAT_KEY_ID}_${LAKANA_BOOTSTRAP_PAT_SECRET}
      LAKANA_SETUP_S3_ACCESS_KEY: ${LAKANA_S3_ACCESS_KEY}
      LAKANA_SETUP_S3_SECRET_KEY: ${LAKANA_S3_SECRET_KEY}
    depends_on:
      server: {condition: service_healthy}
      bucket: {condition: service_completed_successfully}
    restart: "no"

# `default` is the network everything else shares. `internal: true` gives `seaweed-internal` no
# route out of the host either.
networks:
  default:
  seaweed-internal:
    internal: true

configs:
  s3-identity:
    content: |
      {"identities": [{"name": "lakana",
        "credentials": [{"accessKey": "${LAKANA_S3_ACCESS_KEY}", "secretKey": "${LAKANA_S3_SECRET_KEY}"}],
        "actions": ["Admin", "Read", "Write"]}]}

volumes:
  pgdata:
  seaweed:
  worker-cache:
  launcher-socket:
  launcher-state:
  egress-key:
  task-work:
    # Named after the project: the launcher mounts it by name into task containers.
    name: ${COMPOSE_PROJECT_NAME}-task-work
