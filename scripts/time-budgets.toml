# The time budgets of CI, checked by scripts/time_budgets.py (docs/agent/testing.md, "Time budgets").
# Raise a budget only with the maintainer's agreement; a job that grows past its budget gets
# faster or gets another shard first.

# Minutes per job, from its start on a runner to its end. The keys are fnmatch patterns over the
# check names; the first pattern that matches a job is its budget, and every job of ci.yml needs
# one (scripts/tests/test_workflows.py).
[jobs]
"unit (*)" = 15
"integration (*)" = 15
"test (*)" = 10
"integration" = 5
"docs-examples (*)" = 10
"docs-examples" = 5
"compose-smoke" = 15
"five-minute" = 10
"lint" = 10
"ui (*)" = 10
"ui" = 5
"docs" = 10
"changes" = 5
"quarantined tests" = 10

# From this many seconds (setup, call and teardown of the 3.14 unit run in CI) a unit test must
# carry @pytest.mark.slow. The number of marked tests is in scripts/slow-tests-baseline.json: it
# may fall, never rise.
[slow_tests]
threshold_seconds = 2.0
# The solo re-runs of a flagged test (--confirm; up to three, the fastest counts) fail it only from
# this many seconds: a test that sits at the threshold would otherwise pass and fail on the same
# code.
confirm_seconds = 2.5
# The time of the reference workload (REFERENCE_WORKLOAD in scripts/time_budgets.py, the fastest of
# five runs) on a fast GitHub runner. With --confirm the ratchet times it on its own runner first
# and raises confirm_seconds by the ratio, never below 1 and at most MAX_SPEED_RATIO (2), so a slow
# runner does not fail tests that are fast elsewhere (#725). Recalibrate it whenever the workload
# changes: the step log prints the time and the ratio. Calibrated on 2026-11-19 from three
# `test (3.14)` runs of #747 (run 44584790489, attempts 1–3: 0.232, 0.335 and 0.289 s), the fastest.
reference_seconds = 0.232
