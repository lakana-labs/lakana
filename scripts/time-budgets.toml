# The time budgets of CI, checked by scripts/time_budgets.py (docs/agent/testing.md, "Time budgets").
# Raise a budget only with the maintainer's agreement; a job that grows past its budget gets
# faster or gets another shard first.

# Minutes per job, from its start on a runner to its end. The keys are fnmatch patterns over the
# check names; the first pattern that matches a job is its budget, and every job of ci.yml needs
# one (scripts/tests/test_workflows.py).
[jobs]
"unit (*)" = 15
"integration (*)" = 15
"test (*)" = 10
"integration" = 5
"docs-examples" = 15
"compose-smoke" = 15
"five-minute" = 10
"lint" = 10
"docs" = 10
"changes" = 5
"quarantined tests" = 10

# From this many seconds (setup, call and teardown of the 3.14 unit run in CI) a unit test must
# carry @pytest.mark.slow. The number of marked tests is in scripts/slow-tests-baseline.json: it
# may fall, never rise.
[slow_tests]
threshold_seconds = 2.0
