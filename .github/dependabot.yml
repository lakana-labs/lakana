version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:                       # one pull request per week, not one per package
        patterns: ["*"]
        exclude-patterns: ["ruff", "ty"]   # pinned exactly; each upgrades in its own pull request
    commit-message:
      prefix: "deps"          # "Dependencies" section of the changelog

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:                       # one pull request per week, not one per package
        patterns: ["*"]
    commit-message:
      prefix: "ci"            # hidden from the changelog

  - package-ecosystem: "docker"
    directory: "/"                # Dockerfile and Dockerfile.task: the python base images and the pinned uv image
    schedule:
      interval: "weekly"
    groups:
      images:                       # one pull request per week, not one per package
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/packages/lakana-worker/tests/sshd"   # the test SSH server's alpine image
    schedule:
      interval: "weekly"
    groups:
      test-images:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "pip"
    directory: "/scripts"         # requirements-uv.txt: the hash-pinned uv of the five-minute test
    schedule:
      interval: "weekly"
    groups:
      script-tools:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/tools/jscpd"     # package-lock.json: the pinned jscpd of the duplication check
    schedule:
      interval: "weekly"
    groups:
      script-tools:                   # one pull request per week, not one per package
        patterns: ["*"]
    commit-message:
      prefix: "ci"            # a tool of CI, hidden from the changelog

  - package-ecosystem: "npm"
    directory: "/ui"              # the web interface: exact pins, see docs/agent/conventions.md
    schedule:
      interval: "weekly"
    groups:
      ui-runtime:                     # what ships: one pull request per week
        dependency-type: "production"
        patterns: ["*"]
      # Development tools upgrade one per pull request (the pinned-tool rule), except these exact
      # pins, which only work together. typescript and typescript-eslint stay apart on purpose:
      # TypeScript 7 is held back until typescript-eslint supports it.
      ui-vitest:
        dependency-type: "development"
        patterns: ["vitest", "@vitest/*"]
      ui-size-limit:
        dependency-type: "development"
        patterns: ["size-limit", "@size-limit/*"]
      ui-react-types:
        dependency-type: "development"
        patterns: ["@types/react", "@types/react-dom"]
      ui-testing-library:
        dependency-type: "development"
        patterns: ["@testing-library/*"]
    ignore:
      # ESLint stays on 9 until eslint-plugin-jsx-a11y supports 10 (docs/agent/conventions.md);
      # @eslint/js moves with it, never ahead of it.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint declares `typescript <6.1.0`: TypeScript takes patch updates only until
      # typescript-eslint widens its range (docs/agent/conventions.md).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "deps"                  # runtime: the "Dependencies" section of the changelog
      prefix-development: "build"     # a tool: hidden from the changelog
