name: Scorecard

# OpenSSF Scorecard: scores the repository's supply-chain practices and publishes the result
# for the README badge. It runs on GitHub's runner, not on `CI_RUNNER`: published results
# are only accepted from a GitHub-hosted job.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"    # Mondays 04:30 UTC
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF results to code scanning
      id-token: write          # publish the results to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: results.sarif
