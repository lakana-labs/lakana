name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Decides whether this pull request changes documentation only (`scripts/docs_only.py`).
  # The jobs below skip their heavy work when it does. Every doubt and every error
  # says "not docs-only", and a push to main always runs everything.
  changes:
    runs-on: ${{ (github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER) || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      # The classifier is fetched from the base commit, so a pull request cannot change the
      # rule it is judged by. It is fetched, not checked out: a sparse checkout would stay
      # configured in the workspace a self-hosted runner reuses for the next job.
      - id: scope
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          verdict="false"
          if [ "$EVENT" = "pull_request" ]; then
            if gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/docs_only.py?ref=${BASE_SHA}" \
              -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/docs_only.py" \
              && gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"; then
              if [ "$(python3 "$RUNNER_TEMP/docs_only.py" < "$RUNNER_TEMP/changed.txt")" = "true" ]; then
                verdict="true"
              fi
            fi
          fi
          echo "docs_only=${verdict}" >> "$GITHUB_OUTPUT"

  static:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ (github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-groups --all-extras --locked
      - name: bandit
        run: uv run --with 'bandit[toml]' bandit -r packages -c pyproject.toml
      - name: pip-audit
        run: uv run --locked --all-groups --with pip-audit pip-audit
      - name: Dependency licences
        run: uv run python scripts/check_licenses.py

  # The npm locks of the interface (ui/) and of the duplication check (tools/jscpd), audited by
  # npm and by osv-scanner at the lowest level: a finding of any severity fails. The last step
  # proves both tools fail on a lock with a known advisory, generated here and never committed.
  npm-audit:
    name: npm audit
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ (github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: ui/.nvmrc
      # The lock is enough: nothing is installed.
      - name: npm audit
        run: |
          npm audit --audit-level=low --prefix ui
          npm audit --audit-level=low --prefix tools/jscpd
      # The osv-scanner command line (Apache-2.0): one pinned release, refused unless its SHA-256
      # matches; raise both together from the release's osv-scanner_SHA256SUMS file.
      - name: Install osv-scanner
        env:
          OSV_SCANNER_VERSION: "2.7.0"
          OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "This job installs the linux_amd64 build of osv-scanner; the runner is $(uname -m)." >&2
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: osv-scanner
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile ui/package-lock.json --lockfile tools/jscpd/package-lock.json
      - name: Prove the audit fails on a known advisory
        run: |
          mkdir -p "$RUNNER_TEMP/audit-probe"
          cd "$RUNNER_TEMP/audit-probe"
          echo '{"name": "audit-probe", "private": true}' > package.json
          npm install --package-lock-only --ignore-scripts lodash@4.17.20
          if npm audit --audit-level=low; then
            echo "npm audit passed a lock with lodash 4.17.20, which has known advisories." >&2
            exit 1
          fi
          if "$RUNNER_TEMP/osv-scanner" scan source --lockfile package-lock.json; then
            echo "osv-scanner passed a lock with lodash 4.17.20, which has known advisories." >&2
            exit 1
          fi
          echo "Both npm audit and osv-scanner fail on a known advisory, as they should."

  secrets:
    runs-on: ${{ (github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER) || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks command line (MIT), not its GitHub Action: the action needs a paid licence
      # key for a repository owned by an organisation. One pinned release, refused unless its
      # SHA-256 matches; raise both together from the release's checksums file.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "This job installs the linux_x64 build of gitleaks; the runner is $(uname -m)." >&2
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the new commits for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A pull request: its own commits. A push: the pushed ones; a new branch or a
          # force-push without a known base: the whole history.
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$HEAD"
          else
            range="$HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="$range" .
