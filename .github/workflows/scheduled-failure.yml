name: Scheduled failure report

# A failed scheduled run notifies only the last person who edited its cron, so the weekly image
# scan failed unseen for three weeks. This turns the failure of a scheduled security or canary
# workflow into an open issue: one per workflow, labelled type:security and assigned to the
# maintainer; a further failure while it is open adds a comment. Close the issue once a
# scheduled run passes again. scripts/tests/test_workflows.py pins the list below to every
# scheduled workflow (mutation.yml is left out on purpose).

on:
  workflow_run:
    workflows: ["Dependency canary", "CodeQL", "Scorecard", "Security (deep)"]
    types: [completed]

permissions: {}

jobs:
  report:
    # Only a failed scheduled run: a pull request's CodeQL run, perhaps a fork's, never gets here.
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write   # open or comment on the failure's issue; no checkout, no other scope
    steps:
      - name: Open or update the issue of the failed workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          export TITLE="Scheduled run failed: $WORKFLOW"
          body="The scheduled run of $WORKFLOW failed on $SHA: $RUN_URL"
          number=$(gh issue list --state open --label type:security --limit 200 \
            --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --label type:security --assignee chrschy --body "$body

          Next step: read the failed job's log at the link above. For the image scan (Trivy), follow
          docs/agent/security.md, \"Image scan\". Close this issue once a scheduled run passes;
          a further failure while it is open adds a comment here."
          fi
