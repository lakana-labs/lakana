name: Fuzzing

# ClusterFuzzLite runs the Atheris harnesses in fuzz/ (docs/agent/security.md, "Fuzzing"):
# about five minutes on a pull request that changes what they parse with, and an hour every night
# on main, followed by pruning. The corpus is kept with actions/cache, written only by the nightly
# job on main. A crash fails the run and uploads its input as the `fuzz-crash-*` artifact.
#
# No ClusterFuzzLite action gets a token, so none uses its GitHub Actions filestore: to find a
# corpus, that filestore pages through every artifact of the repository and, finding none, keeps
# paging until the token's rate limit, which the repository's other workflows share (one run made
# about 5,000 requests in 21 minutes). It also takes the newest artifact of the corpus's name from
# any branch or workflow and unpacks it with tarfile.extractall.
#
# Only a pull request from a branch of this repository is fuzzed, and only `main` runs the nightly
# job (also when started by hand). The fuzzers run where ACTIONS_RUNTIME_TOKEN is, so a fork's
# harness code could write artifacts and caches in its pull request's scope; main never reads
# either, but a fork's run should not hold the token at all. A fork's change is fuzzed by the
# nightly run once it is merged (docs/agent/security.md, "Fuzzing").
#
# On GitHub's runner, never `CI_RUNNER`: the actions build and run Docker images, and a pull
# request's harnesses are its own code. The actions clone the repository themselves (a public
# one, so without a token) and build .clusterfuzzlite/Dockerfile; their own images
# (gcr.io/oss-fuzz-base/clusterfuzzlite-*:v1) are named by the actions, not by this file.
on:
  pull_request:
    paths:
      # What the harnesses import: scripts/tests/test_fuzz.py fails when a module they load is
      # missing here.
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/fuzz.yml"
      - "uv.lock"
      - "packages/lakana-core/pyproject.toml"
      - "packages/lakana-core/src/lakana_core/*.py"
      - "packages/lakana-core/src/lakana_core/access/**"
      - "packages/lakana-core/src/lakana_core/artifacts/__init__.py"
      - "packages/lakana-core/src/lakana_core/artifacts/manifest.py"
      - "packages/lakana-core/src/lakana_core/grants/__init__.py"
      - "packages/lakana-core/src/lakana_core/grants/roles.py"
      - "packages/lakana-core/src/lakana_core/jobs/__init__.py"
      - "packages/lakana-core/src/lakana_core/jobs/cron.py"
      - "packages/lakana-core/src/lakana_core/jobs/tz.py"
      - "packages/lakana-core/src/lakana_core/projects/**"
  schedule:
    - cron: "0 2 * * *"     # every night, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-request:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: fuzz-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      # Without a token the build logs "ERROR - Could not get coverage" (a 401 on the artifacts
      # API) while it looks for a coverage report. Expected: no job makes one, so every fuzzer
      # is kept.
      - name: Build the fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          language: python
          sanitizer: address
      # Read-only: a pull request starts from main's corpus and never saves one.
      - name: Restore the corpus main keeps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: cifuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-
      # No token (see the top): its own corpus download fails at once with the same 401, as
      # expected, and leaves the restored corpus in cifuzz-corpus/<fuzzer>, where it fuzzes from.
      - name: Fuzz for five minutes
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          mode: code-change
          fuzz-seconds: 300
          sanitizer: address
      - name: Upload the input that crashed
        if: ${{ failure() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: fuzz-crash-pull-request
          path: ./out/artifacts

  # Fuzzes main for an hour and prunes the corpus (.clusterfuzzlite/nightly.sh), which actions/cache
  # keeps under a new key each night. A cache written on main is readable by main and by pull
  # requests, and nothing a pull request runs can write into main's scope.
  nightly:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # The 401 "Could not get coverage" error in this step's log is expected, as above.
      - name: Build the fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          language: python
          sanitizer: address
      - name: Restore the kept corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: cifuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-
      - name: Fuzz for an hour, then prune the corpus
        run: .clusterfuzzlite/nightly.sh build-out cifuzz-corpus out/artifacts "$FUZZ_SECONDS" "$RUNNER_IMAGE"
        env:
          FUZZ_SECONDS: "1200"     # per fuzzer; three fuzzers
          # Pinned by tag and digest. Dependabot does not read it: bump it by hand
          # (`docker buildx imagetools inspect gcr.io/oss-fuzz-base/base-runner:latest`).
          RUNNER_IMAGE: gcr.io/oss-fuzz-base/base-runner:latest@sha256:29e4fcca00f6b844d732ee7427e86dae478db7f78d3ef7128ba1505ea4ab7126
      - name: Keep the corpus
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: cifuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload the input that crashed
        if: ${{ failure() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: fuzz-crash-nightly
          path: ./out/artifacts
