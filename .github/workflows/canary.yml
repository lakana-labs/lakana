name: Dependency canary

# Installs Lakana as a user does, with every third-party dependency unpinned, and runs the
# five-minute test. The lock cannot catch a breaking release of a dependency, because a
# `pip install` ignores it: this job sees one within a day. A failure is a failed scheduled
# run, which GitHub reports to the maintainer; the job writes nothing back.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
      - run: uv build --all-packages -o dist
      - name: Five-minute exit test (clean python:3.14-slim container)
        # Pinned to this job's own build, exactly as the `five-minute` job of ci.yml: `lakana` is
        # the wheel built from `main` (its version carries a local segment PyPI never accepts),
        # while every third-party dependency resolves from PyPI unpinned, which is the point.
        run: |
          version=$(basename dist/lakana-[0-9]*.whl | cut -d- -f2)
          docker run --rm -e GITHUB_STEP_SUMMARY=/summary/out.md -e LAKANA_EXPECTED_VERSION="$version" \
            -v "$PWD/dist:/dist:ro" -v "$PWD/scripts:/scripts:ro" -v "$RUNNER_TEMP:/summary" \
            python:3.14-slim bash /scripts/five_minute_test.sh --find-links /dist "lakana[server]==$version"
      - name: Show the resolved versions and the timings
        if: ${{ always() }}
        run: cat "$RUNNER_TEMP/out.md" >> "$GITHUB_STEP_SUMMARY" || true
