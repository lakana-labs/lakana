name: Dependency canary

# Installs Lakana as a user does, with every third-party dependency unpinned, and runs the
# five-minute test. The lock cannot catch a breaking release of a dependency, because a
# `pip install` ignores it: this job sees one within a day. A failure is a failed scheduled
# run, which scheduled-failure.yml turns into an issue; this job writes nothing back. The second
# job, `ui-browsers`, runs the web interface's end-to-end tests in Firefox and WebKit, one browser
# per leg, which a pull request tests in Chromium only: those against a real lakana-server, then
# the whole mocked suite the release runs, so a test that fails in one browser alone shows up
# within a day, not when a release is cut.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - run: uv build --all-packages -o dist
      - name: Five-minute exit test (clean python:3.14-slim container)
        # Pinned to this job's own build, exactly as the `five-minute` job of ci.yml: `lakana` is
        # the wheel built from `main` (its version carries a local segment PyPI never accepts),
        # while every third-party dependency resolves from PyPI unpinned, which is the point.
        run: |
          version=$(basename dist/lakana-[0-9]*.whl | cut -d- -f2)
          docker run --rm -e GITHUB_STEP_SUMMARY=/summary/out.md -e LAKANA_EXPECTED_VERSION="$version" \
            -v "$PWD/dist:/dist:ro" -v "$PWD/scripts:/scripts:ro" -v "$RUNNER_TEMP:/summary" \
            python:3.14-slim bash /scripts/five_minute_test.sh --find-links /dist "lakana[server]==$version"
      - name: Show the resolved versions and the timings
        if: ${{ always() }}
        run: cat "$RUNNER_TEMP/out.md" >> "$GITHUB_STEP_SUMMARY" || true

  ui-browsers:
    name: ui-browsers (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: uv sync --all-packages --locked
      - run: npm ci --ignore-scripts --prefix ui
      - run: npm --prefix ui run build
      - run: npx --prefix ui playwright install --with-deps ${{ matrix.browser }}
      - name: The end-to-end tests against a real lakana-server
        run: npm --prefix ui run e2e:server -- --project=${{ matrix.browser }}
      - name: The mocked end-to-end suite, as the release runs it
        # Also after a failed server run, so one red run reports both suites.
        if: ${{ !cancelled() }}
        run: npm --prefix ui run e2e:all -- --project=${{ matrix.browser }}
