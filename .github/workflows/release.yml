name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}

# No job inherits a permission: each one below names what it needs.
permissions: {}

jobs:
  # Opens and merges the release pull request; it builds nothing, so it may run on the
  # configured runner. Every job below builds or publishes and stays on GitHub's runners.
  release-please:
    runs-on: ${{ (github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER) || 'ubuntu-latest' }}
    # Nothing from GITHUB_TOKEN: the action is given RELEASE_PLEASE_TOKEN below and uses only
    # that to open the release PR, tag and create the release.
    permissions: {}
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A personal access token, not the default one: pull requests opened with
          # GITHUB_TOKEN start no workflow runs, so the release PR would get no CI.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # Four packages, one atomic publish: lakana-server and lakana-worker each
  # pin lakana-core to this exact release, and lakana's `server` extra pins both
  # of those in turn (see docs/agent/release.md), so a partial publish would
  # leave `pip install "lakana[server]"` unresolvable. build produces every
  # wheel/sdist once from the tag; publish-core, then publish-runtime, then
  # publish-sdk gate on each other via `needs` so a failed upload stops
  # everything downstream of it instead of leaving a dangling pin.
  build:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
      - name: Build all packages
        run: uv build --all-packages -o dist
      - name: Verify the version carries no local segment
        run: |
          if compgen -G "dist/*+*.whl" > /dev/null; then
            echo "Local version segment present — PyPI will reject this." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dist
          path: dist/

  # The one approval of a release: every job that publishes or signs anything waits for it, so
  # rejecting it publishes nothing. It runs no code and holds no permission; the reviewer is set
  # on the `release-approval` environment (Settings > Environments, see docs/agent/release.md).
  approve:
    needs: [release-please, build]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-approval
    permissions: {}
    steps:
      - run: echo "Release $TAG approved for publishing"
        env: {TAG: "${{ needs.release-please.outputs.tag }}"}

  # Signs what `build` produced: a build provenance attestation (Sigstore, keyless) for every
  # wheel and sdist, which `gh attestation verify <file> --repo lakana-labs/lakana` checks (see
  # docs/agent/release.md). It runs next to the publish jobs, so a failure here never leaves a
  # half-published release; the bundle goes to the release page from `provenance-release`.
  attest-dist:
    needs: [build, approve]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write          # the Sigstore signing certificate
      attestations: write      # stores the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - run: cp "$BUNDLE" lakana-provenance.intoto.jsonl
        env: {BUNDLE: "${{ steps.attest.outputs.bundle-path }}"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: provenance
          path: lakana-provenance.intoto.jsonl

  publish-core:
    needs: [build, approve]
    runs-on: ubuntu-latest
    environment: pypi-lakana-core
    permissions:
      contents: read
      id-token: write          # Trusted Publishing — no long-lived token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist
      - name: Collect lakana-core's dist files
        run: |
          mkdir -p pkg-dist
          cp dist/lakana_core-*.whl dist/lakana_core-*.tar.gz pkg-dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: pkg-dist

  publish-runtime:
    needs: publish-core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: lakana-server
            environment: pypi-lakana-server
          - package: lakana-worker
            environment: pypi-lakana-worker
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write          # Trusted Publishing — no long-lived token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist
      - name: Collect ${{ matrix.package }}'s dist files
        run: |
          mkdir -p pkg-dist
          normalized="$(echo "${{ matrix.package }}" | tr - _)"
          cp "dist/${normalized}-"*.whl "dist/${normalized}-"*.tar.gz pkg-dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: pkg-dist

  publish-sdk:
    # Every lakana-server/lakana-worker matrix leg must succeed: a job's default
    # `needs` condition requires the whole needed job, all matrix legs
    # included, to have succeeded (see docs/agent/release.md).
    needs: publish-runtime
    runs-on: ubuntu-latest
    environment: pypi-lakana
    permissions:
      contents: read
      id-token: write          # Trusted Publishing — no long-lived token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist
      - name: Collect lakana's dist files
        run: |
          mkdir -p pkg-dist
          cp dist/lakana-[0-9]*.whl dist/lakana-[0-9]*.tar.gz pkg-dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: pkg-dist

  # Ships the container image built from the same tagged wheels the publish
  # jobs above just uploaded (the same ordering, but for the image: it
  # needs `publish-sdk` too so a broken PyPI release never gets a matching
  # "latest" container). Pruning old versions is a separate job below,
  # gated on the smoke test, so a bad image is never left as the only one.
  publish-image:
    needs: [release-please, build, approve, publish-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with: {ref: "${{ needs.release-please.outputs.tag }}"}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with: {name: dist, path: dist}
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
      - name: Generate the pinned requirements file (with hashes) for the image build
        # The shared `dist` artifact only has wheels/sdists; the Dockerfile
        # also needs dist/requirements.txt. Generated here rather than added
        # to the shared artifact, so the other publish jobs' dist/ globs
        # never have to account for an extra file.
        run: uv export --frozen --no-dev --all-packages --no-emit-workspace -o dist/requirements.txt
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env: {TAG: "${{ needs.release-please.outputs.tag }}"}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/lakana-labs/lakana:${{ steps.version.outputs.version }}

  # One task image per supported Python, with the release's version: the launcher's allow-list in
  # the Compose bundle names them. Built from the tag, like the main image.
  publish-task-images:
    needs: [release-please, build, approve, publish-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with: {ref: "${{ needs.release-please.outputs.tag }}"}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with: {name: dist, path: dist}
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
      - name: Generate the connection check's pinned requirements file (with hashes)
        # The image's /opt/lakana-check gets the release's lakana wheel from `dist` and exactly
        # the locked versions of its dependencies, by hash.
        run: uv export --frozen --package lakana --no-dev --no-emit-project --format requirements-txt -o dist/check-requirements.txt
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env: {TAG: "${{ needs.release-please.outputs.tag }}"}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: Dockerfile.task
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PYTHON=${{ matrix.python }}
          tags: ghcr.io/lakana-labs/lakana-task:${{ steps.version.outputs.version }}-py${{ matrix.python }}
      - name: Hand the pushed digest to the attestation job
        # A matrix job has no single output, so each leg uploads the digest its own push reported.
        run: echo "${DIGEST}" > digest.txt
        env: {DIGEST: "${{ steps.build.outputs.digest }}"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: task-digest-${{ matrix.python }}
          path: digest.txt

  # Signs the pushed image by digest. Its own job: `publish-image` runs several third-party
  # actions, and any step of a job with `id-token: write` could ask for a signing certificate.
  # `gh attestation verify` reads attestations from GitHub, so nothing is pushed to the registry.
  attest-image:
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write          # the Sigstore signing certificate
      attestations: write      # stores the attestation
    steps:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/lakana-labs/lakana
          subject-digest: ${{ needs.publish-image.outputs.digest }}
          push-to-registry: false

  # Signs each task image by digest, like `attest-image`. The digest is the one the push step of
  # the same matrix leg reported (an artifact), not a read-back from a mutable tag.
  attest-task-images:
    needs: publish-task-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write          # the Sigstore signing certificate
      attestations: write      # stores the attestation
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: task-digest-${{ matrix.python }}
      - id: digest
        run: echo "digest=$(tr -d '[:space:]' < digest.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/lakana-labs/lakana-task
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: false

  five-minute-release:
    needs: [release-please, publish-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with: {ref: "${{ needs.release-please.outputs.tag }}"}
      - id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env: {TAG: "${{ needs.release-please.outputs.tag }}"}
      - name: Wait until PyPI shows the release
        # PyPI's index can lag an upload by several minutes; wait (at most 15, JSON API and
        # the simple index pip reads) before the
        # first install instead of failing it. The install's own retries stay for blips.
        run: python3 scripts/wait_for_pypi.py "${{ steps.version.outputs.version }}"
      - name: Five-minute test against PyPI
        # PyPI can lag a few seconds behind the upload, so the pip
        # install inside the script can fail transiently right after
        # publish. The script emits one step-summary for the whole run and
        # doesn't report the install step's outcome separately from the
        # rest, so on failure this retries the whole run (up to 5 attempts,
        # 30s apart) rather than just the install.
        run: |
          max_attempts=5
          attempt=1
          until docker run --rm -e GITHUB_STEP_SUMMARY=/summary/out.md \
              -e LAKANA_EXPECTED_VERSION="${{ steps.version.outputs.version }}" \
              -v "$PWD/scripts:/scripts:ro" -v "$RUNNER_TEMP:/summary" \
              python:3.14-slim bash /scripts/five_minute_test.sh \
              "lakana[server]==${{ steps.version.outputs.version }}"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Five-minute test failed after $attempt attempts" >&2
              # Preserve whatever timing table the last attempt produced —
              # otherwise it's the one run where the summary matters most.
              cat "$RUNNER_TEMP/out.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
              exit 1
            fi
            echo "Attempt $attempt failed; retrying in 30s in case PyPI is still propagating the upload..." >&2
            attempt=$((attempt + 1))
            sleep 30
          done
          cat "$RUNNER_TEMP/out.md" >> "$GITHUB_STEP_SUMMARY"

  compose-smoke-release:
    needs: [release-please, publish-image, publish-task-images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        # Full history: the smoke test builds a wheel here (hatch-vcs reads the tags) and
        # refuses one whose version differs from the pushed image's.
        with: {ref: "${{ needs.release-please.outputs.tag }}", fetch-depth: 0}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
      - id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env: {TAG: "${{ needs.release-please.outputs.tag }}"}
      - run: |
          uv run --locked bash scripts/compose_smoke_test.sh "ghcr.io/lakana-labs/lakana:${{ steps.version.outputs.version }}" "ghcr.io/lakana-labs/lakana-task:${{ steps.version.outputs.version }}"

  sbom:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: lakana-sbom.spdx.json
          output-file: lakana-sbom.spdx.json
          upload-release-assets: false

  # The OpenAPI document of the platform REST API, for whoever builds against a release: the
  # committed snapshot (CI's docs job keeps it current) with the release's version in
  # `info.version`. Read-only, after the approval; `sbom-release` attaches it.
  openapi:
    needs: [release-please, approve]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Write the release's version into the document
        run: jq --arg version "${TAG#v}" '.info.version = $version' docs/site/reference/openapi.json > lakana-openapi.json
        env: {TAG: "${{ needs.release-please.outputs.tag }}"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: lakana-openapi.json
          path: lakana-openapi.json

  # The only job that can write to the repository's contents. It runs no third-party code
  # that builds anything: it downloads the SBOM and the OpenAPI document and uploads them to
  # the release.
  sbom-release:
    needs: [release-please, approve, sbom, openapi]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: lakana-sbom.spdx.json
          path: sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: lakana-openapi.json
          path: openapi
      - name: Attach the SBOM and the OpenAPI document to the GitHub release
        run: gh release upload "$TAG" sbom/lakana-sbom.spdx.json openapi/lakana-openapi.json --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}

  # Puts the provenance bundle on the release page, where Scorecard looks for a signature. Like
  # `sbom-release`, it runs nothing but the artifact download and the upload.
  provenance-release:
    needs: [release-please, attest-dist]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: provenance
          path: provenance
      - name: Attach the provenance bundle to the GitHub release
        run: gh release upload "$TAG" provenance/lakana-provenance.intoto.jsonl --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}

  # Publishes the documentation site at https://lakana-labs.github.io/lakana/ from the release
  # tag, so the site always describes the released version; a change on `main` appears with
  # the next release. It runs the project's code, so it only reads the repository; the
  # deployment is its own job below.
  pages:
    needs: [release-please, approve]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0          # hatch-vcs needs tags to compute a version
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
      - run: uv sync --locked --all-packages --group docs
      - run: uv run python scripts/docs_blocks.py
      - name: Build the site
        run: uv run --group docs zensical build --strict
      - name: Built site (no external resources, no missing files, no URL outside /lakana/)
        run: uv run python scripts/check_built_site.py site-build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site-build

  # The only job with the scopes a deployment needs; it runs nothing but the deploy action.
  pages-deploy:
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write          # the deploy action proves the artifact comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
