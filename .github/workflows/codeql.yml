# CodeQL static analysis of the Python code; results go to code scanning (Security tab) and are
# what OpenSSF Scorecard's SAST check looks for. Free on a public repository.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 2"     # Tuesdays 04:17 UTC, a day after the deep security scans

# Read-only at the top: the one job below asks for the scope that uploads results.
permissions:
  contents: read

jobs:
  analyze:
    # A GitHub-hosted runner: what CodeQL downloads and runs is not code to hand to a
    # self-hosted machine, and a fork's pull request must never reach one.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # the upload to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: /language:python
