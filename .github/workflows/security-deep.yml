name: Security (deep)

on:
  schedule:
    - cron: "0 3 * * 1"     # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The scan runs a third-party image over the checkout, so it holds no write scope and no
  # token in the workspace; the upload to code scanning is the separate job below.
  semgrep:
    permissions:
      contents: read
    runs-on: ${{ (github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER) || 'ubuntu-latest' }}
    container:
      # Pinned by version and digest. Dependabot does not read a workflow's `container:` image:
      # bump both by hand (`docker buildx imagetools inspect semgrep/semgrep:<version>`).
      image: semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # ui/scripts/lint-fixtures holds deliberate violations that lint-ban.test.ts lints on purpose
      # (raw HTML, for one); they never ship, so the scan leaves them out instead of reporting them.
      - run: >-
          semgrep scan --config=p/python --config=p/security-audit
          --exclude=ui/scripts/lint-fixtures --sarif --output=semgrep.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  # The only job with `security-events: write`: no checkout, and no action but the artifact
  # download and the upload to code scanning.
  semgrep-upload:
    needs: semgrep
    if: ${{ !cancelled() }}
    permissions:
      security-events: write   # the SARIF upload to code scanning
    runs-on: ${{ (github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: semgrep-sarif
          path: sarif
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: sarif/semgrep.sarif
          category: semgrep

  trivy:
    runs-on: ${{ (github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - name: Build wheels
        run: uv build --all-packages -o dist
      - name: Generate the pinned requirements file (with hashes) for the image build
        run: uv export --frozen --no-dev --all-packages --no-emit-workspace -o dist/requirements.txt
      - name: Build the image to scan
        run: docker build -t lakana:scan .
      # Pinned by commit SHA, not the mutable v0.36.0 tag: trivy-action tags
      # were force-pushed to malicious commits in a March 2026 supply-chain
      # attack that stole CI secrets from downstream repos.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: lakana:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  # The task images (one per supported Python), built as the release builds them and scanned
  # with the same rules as the server image above.
  trivy-task:
    runs-on: ${{ (github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - name: Generate the check environment's pinned requirements (with hashes) for the image build
        run: uv export --frozen --only-group check --no-emit-workspace -o dist/check-requirements.txt
      - name: Build the task image to scan
        run: docker build -f Dockerfile.task --build-arg PYTHON=${{ matrix.python }} -t lakana-task:scan .
      # Pinned by commit SHA, as in the job above.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: lakana-task:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
