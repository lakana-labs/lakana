name: Bug report
description: Something does not work as the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Lakana is pre-1.0 and has one maintainer; see [SUPPORT.md](https://github.com/lakana-labs/lakana/blob/main/.github/SUPPORT.md).
        For a security problem, do not open an issue: use private vulnerability reporting
        (see [SECURITY.md](https://github.com/lakana-labs/lakana/blob/main/.github/SECURITY.md)).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact error message.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands or code, as short as you can make them.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `lakana --version`.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How do you run Lakana?
      options:
        - Local instance (lakana server start --local)
        - Docker Compose (team bundle)
        - Other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Python version
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens, passwords and anything else secret first.
      render: shell
